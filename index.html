<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine’s Day Aarti ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2.7rem;
      margin-bottom: 10px;
      animation: heartbeat 1.5s infinite;
    }

    h2 {
      font-size: 1.6rem;
      margin: 15px 0;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .from {
      margin-top: 25px;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .heart {
      position: absolute;
      font-size: 22px;
      animation: floatUp linear infinite;
      opacity: 0.85;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>❤️ Happy Valentine’s Day ❤️</h1>
    <h2>Dear Aarti 💕</h2>
    <p>
      You make every day brighter just by being you ✨<br>
      Your smile, your kindness, your presence—<br>
      they mean more to me than words can say 💖
    </p>
    <p>
      On this Valentine’s Day, I just want you to know—<br>
      you are special, cherished, and loved ❤️
    </p>
    <div class="from">
      Forever yours 💌
    </div>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 250);
  </script>

</body>
</html>
